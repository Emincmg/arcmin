[package]
name = "arcmin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arcweave-rust = "0.0.1"
eframe = "0.36.2"
image = "0.25.10"
ouroboros = "0.18.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4"] }

# Image decoding/resizing is far too slow unoptimised; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 3
